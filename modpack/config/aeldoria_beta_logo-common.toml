
[general]
	#Master switch for the Aeldoria race system.
	enabled = true
	#Open the lineage menu the first time a player joins.
	openMenuOnFirstLogin = true
	#Apply Pehkui body scale when Pehkui is installed.
	enablePehkuiScale = true
	#Apply mana attributes when a compatible magic mod exposes max mana.
	enableManaBonuses = true
	#Apply mana regeneration attributes when a compatible magic mod exposes mana regeneration.
	enableManaRegenBonuses = true
	#Refresh racial potion passives such as haste, luck, jump boost and night vision.
	enablePassiveEffects = true
	#Apply racial weakness while exposed to daylight.
	enableSunWeakness = true

[combat_passives]
	#Elves deal slightly more projectile damage.
	enableElfProjectileBonus = true
	#Elf projectile damage bonus as percent. 8 means +8%.
	#Range: 0.0 ~ 100.0
	elfProjectileBonusPercent = 8.0
	#Elf mana regeneration bonus as percent. 10 means +10%.
	#Range: -100.0 ~ 300.0
	elfManaRegenBonusPercent = 10.0
	#Dark elf mana regeneration bonus as percent. Default is 0 because they focus on max mana.
	#Range: -100.0 ~ 300.0
	darkElfManaRegenBonusPercent = 0.0
	#Undead mana regeneration bonus as percent. Default is 0 for balance.
	#Range: -100.0 ~ 300.0
	undeadManaRegenBonusPercent = 0.0
	#Orcs gain Strength I while under the configured health threshold.
	enableOrcLowHealthStrength = true
	#Orc strength threshold as health ratio. 0.35 means 35%.
	#Range: 0.05 ~ 0.95
	orcLowHealthThreshold = 0.35
	#Undead remove poison and hunger effects during racial passive refresh.
	enableUndeadPoisonHungerResist = true
	#Dark elves and undead emit a small visual aura when compatible mana is full.
	enableFullManaAura = true
	#How often the full mana aura checks and emits particles. 20 ticks = 1 second.
	#Range: 5 ~ 200
	fullManaAuraIntervalTicks = 20
	#Particle count per full mana aura pulse. Keep low for multiplayer.
	#Range: 1 ~ 20
	fullManaAuraParticles = 5

[orbe_de_linaje]
	#Consume one Orbe de Linaje when changing an already chosen lineage.
	consumeOnChange = true
	#Cooldown after using the Orbe de Linaje. 20 ticks = 1 second.
	#Range: 0 ~ 72000
	cooldownTicks = 1200
	#Players cannot change lineage for this many ticks after taking or dealing damage. 20 ticks = 1 second.
	#Range: 0 ~ 12000
	combatLockTicks = 240
	#Prevent lineage changes while riding another entity.
	preventChangeWhileMounted = true
	#Prevent lineage changes if hostile mobs are inside this radius. 0 disables.
	#Range: 0 ~ 64
	hostileLockRadius = 10

