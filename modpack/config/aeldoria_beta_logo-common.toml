[class_system]
	#Master switch for the Aeldoria class level system.
	enabled = true
	#Maximum class level.
	#Range: 1 ~ 100
	maxLevel = 30
	#Show small actionbar messages when players gain class XP.
	showXpMessages = true
	#Base class XP gained from killing hostile or living enemies. Small mobs are capped by code for balance.
	#Range: 0 ~ 10000
	killXp = 8
	#Extra XP for projectile kills, useful for Explorador.
	#Range: 0 ~ 10000
	projectileKillXp = 4
	#Extra XP for killing undead enemies, useful for Clerigo.
	#Range: 0 ~ 10000
	undeadKillXp = 6
	#Extra class XP when a detected owned summon kills an enemy, useful for Invocador.
	#Range: 0 ~ 10000
	summonKillXp = 2

