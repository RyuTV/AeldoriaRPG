appId: 'com.aeldoria.launcher'
productName: 'Aeldoria Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Aeldoria RPG. Basado en Helios Launcher de Daniel Scalzi.'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Aeldoria RPG'
  vendor: 'Aeldoria RPG'
  synopsis: 'Launcher oficial de Aeldoria RPG'
  description: 'Launcher oficial para instalar, actualizar e iniciar Aeldoria RPG automáticamente.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'